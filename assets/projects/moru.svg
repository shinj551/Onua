thic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#242422" text-anchor="start" letter-spacing="0" >Ham and cheese</text><text x="36" y="274" font-family="'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#242422" text-anchor="start" letter-spacing="0" >Roast vegetables</text><text x="36" y="326" font-family="'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#242422" text-anchor="start" letter-spacing="0" >Seasonal sandwich</text></g><g transform="translate(860 700)"><circle r="38" fill="#2F5B4F"/><text x="0" y="7" font-family="'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" >autumn</text></g></svg>
