<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img"><title>Example outputs for Moru: a sandwich half-wrapped in white paper, a green seasonal stamp and a window menu card</title><defs>
